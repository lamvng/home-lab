apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: home-lab
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/lamvng/home-lab.git
        revision: develop
        directories:
          - path: kube/applications/*/*
  template:
    metadata:
      name: '{{.path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/lamvng/home-lab.git
        targetRevision: develop
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{index .path.segments 2}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        # automated:
        #   prune: true
        #   selfHeal: true
