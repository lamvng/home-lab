                    "data": {
                      "kind": "QueryGroup",
                      "spec": {
                        "queries": [
                          {
                            "kind": "PanelQuery",
                            "spec": {
                              "query": {
                                "kind": "DataQuery",
                                "group": "grafana-postgresql-datasource",
                                "version": "v0",
                                "datasource": {
