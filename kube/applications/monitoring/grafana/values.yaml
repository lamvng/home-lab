                                  "format": "time_series",
                                  "rawQuery": true,
                                  "rawSql": "SELECT\n  DATE(transaction_journals.date AT TIME ZONE transaction_journals.date_tz) AS \"time\",\n  categories.name as \"metric\",\n  SUM(ABS(transactions.amount)) as \"value\"\nFROM category_transaction_journal\nLEFT JOIN categories ON categories.id = category_transaction_journal.category_id\nJOIN transaction_journals ON transaction_journals.id = category_transaction_journal.transaction_journal_id\nJOIN transactions ON transactions.transaction_journal_id = transaction_journals.id\nJOIN transaction_types ON transaction_types.id = transaction_journals.transaction_type_id\n  AND transaction_types.type = 'Withdrawal'\nJOIN transaction_currencies ON transaction_currencies.id = transaction_journals.transaction_currency_id\n  AND transaction_currencies.code = '${currency:regex}'\nJOIN accounts ON accounts.id = transactions.account_id\n  AND accounts.name ~ '${account:regex}'\nWHERE $__timeFilter(transaction_journals.date AT TIME ZONE transaction_journals.date_tz)\nGROUP BY DATE(transaction_journals.date AT TIME ZONE transaction_journals.date_tz), categories.name\nORDER BY DATE(transaction_journals.date AT TIME ZONE transaction_journals.date_tz) ASC",
