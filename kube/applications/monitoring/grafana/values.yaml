                                  "editorMode": "code",
                                  "format": "table",
                                  "rawQuery": true,
                                  "rawSql": "SELECT\n  transaction_types.type,\n  transaction_currencies.code,\n  transaction_journals.date AT TIME ZONE transaction_journals.date_tz,\n  transaction_journals.description,\n  category_journal.name,\n  accounts.name,\n  transactions.amount,\n  transactions.balance_after\nFROM transaction_journals\nJOIN transactions ON transactions.transaction_journal_id = transaction_journals.id\nJOIN transaction_currencies ON transaction_currencies.id = transactions.transaction_currency_id\n  AND transaction_currencies.code ~ '${currency:regex}'\nLEFT JOIN (\n  SELECT category_transaction_journal.transaction_journal_id, categories.name\n  FROM category_transaction_journal\n  LEFT JOIN categories ON category_transaction_journal.category_id = categories.id \n) AS category_journal ON category_journal.transaction_journal_id = transactions.transaction_journal_id\nJOIN transaction_types ON transaction_types.id = transaction_journals.transaction_type_id\nJOIN accounts ON accounts.id = transactions.account_id\n  AND accounts.name ~ '${account:regex}'\nWHERE $__timeFilter(transaction_journals.date AT TIME ZONE transaction_journals.date_tz)\nORDER BY transaction_journals.date DESC;",
