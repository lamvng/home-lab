                "panel-3": {
                  "kind": "Panel",
                  "spec": {
                    "id": 3,
                    "title": "Balance Evolution",
                    "description": "",
                    "links": [],
                    "data": {
                      "kind": "QueryGroup",
                      "spec": {
                        "queries": [
                          {
                            "kind": "PanelQuery",
                            "spec": {
                              "query": {
                                "kind": "DataQuery",
                                "group": "grafana-postgresql-datasource",
                                "version": "v0",
                                "datasource": {
                                  "name": "firefly-postgres"
                                },
                                "spec": {
                                  "dataset": "firefly",
                                  "editorMode": "code",
                                  "format": "time_series",
                                  "rawQuery": true,
                                  "rawSql": "/*\nAccount balances are stored in the `transactions` table for each transaction, in the `balance_before` and `balance_after` columns.\n\nThis query returns balances as a time series, which means:\n1. \"Inactive\" accounts (accounts with no transactions within the time range) are not shown.\n2. Data points exist only when a transaction occurs. We want a continuous time series, even when the balance does not change.\n\nTo address this, the query:\n- Generates a time series to \"fill in\" missing data points when there are no transactions.\n- Retrieves the most recent balances prior to the start of the time range.\n- Captures balance changes for accounts with transactions within the time range.\n- Fills \"inactive\" periods by carrying forward the last known balance.\n*/\n\n--- Generate timestamp to fill all the time range\nWITH date_series AS (\n  SELECT generate_series(\n    $__timeFrom(),\n    $__timeTo(),\n    '1 day'::interval\n  ) AS time\n),\n\n--- Get all accounts, regardless whether there are active transactions in the time range or not\nall_accounts AS (\n  SELECT DISTINCT accounts.id, accounts.name\n  FROM accounts\n  WHERE accounts.name ~ '${account:regex}'\n),\n\n--- Generate a grid of all possible dates x accounts\ndate_account_grid AS (\n  SELECT date_series.time, all_accounts.name\n  FROM date_series\n  CROSS JOIN all_accounts\n),\n\n-- Get the last balances before the start of the time range\nbaseline_balances AS (\n  SELECT DISTINCT ON (accounts.name)\n    accounts.name,\n    transactions.balance_after\n  FROM transactions\n  JOIN transaction_journals ON transaction_journals.id = transactions.transaction_journal_id\n  JOIN transaction_currencies ON transaction_currencies.id = transactions.transaction_currency_id\n    AND transaction_currencies.code ~ '${currency:regex}'\n  JOIN accounts ON accounts.id = transactions.account_id\n    AND accounts.name ~ '${account:regex}'\n  WHERE (transaction_journals.date AT TIME ZONE transaction_journals.date_tz)::date < $__timeFrom()\n  ORDER BY accounts.name, transaction_journals.date DESC\n),\n\n-- Get balances in the time range\nactive_accounts AS (\n  SELECT DISTINCT ON ((transaction_journals.date AT TIME ZONE transaction_journals.date_tz)::date, accounts.name)\n    (transaction_journals.date AT TIME ZONE transaction_journals.date_tz)::date AS \"time\",\n    accounts.name,\n    transactions.balance_after\n  FROM transactions\n  JOIN transaction_journals ON transaction_journals.id = transactions.transaction_journal_id\n  JOIN transaction_currencies ON transaction_currencies.id = transactions.transaction_currency_id\n    AND transaction_currencies.code ~ '${currency:regex}'\n  JOIN accounts ON accounts.id = transactions.account_id\n    AND accounts.name ~ '${account:regex}'\n  WHERE $__timeFilter(transaction_journals.date AT TIME ZONE transaction_journals.date_tz)\n  ORDER BY \"time\" ASC, accounts.name, transaction_journals.date DESC\n),\n\n--- Fill the whole timeseries\nfilled AS (\n  SELECT\n    date_account_grid.time,\n    date_account_grid.name,\n    COALESCE(\n      -- Use actual transaction balance if one exists on this day\n      active_accounts.balance_after,\n      -- Otherwise carry over from a previous day within the range\n      (\n        SELECT active_accounts_2.balance_after\n        FROM active_accounts AS active_accounts_2\n        WHERE active_accounts_2.name = date_account_grid.name\n          AND active_accounts_2.time < date_account_grid.time\n        ORDER BY active_accounts_2.time DESC\n        LIMIT 1\n      ),\n      -- Otherwise fall back to the pre-range baseline\n      baseline_balances.balance_after\n    ) AS balance_after\n  FROM date_account_grid date_account_grid\n  LEFT JOIN active_accounts\n    ON active_accounts.time = date_account_grid.time AND active_accounts.name = date_account_grid.name\n  LEFT JOIN baseline_balances\n    ON baseline_balances.name = date_account_grid.name\n)\n\nSELECT time, name as \"metric\", balance_after as \"value\"\nFROM filled\nWHERE balance_after IS NOT NULL\nORDER BY time ASC, name",
                                  "sql": {
                                    "columns": [
                                      {
                                        "parameters": [],
                                        "type": "function"
                                      }
                                    ],
                                    "groupBy": [
                                      {
                                        "property": {
                                          "type": "string"
                                        },
                                        "type": "groupBy"
                                      }
                                    ],
                                    "limit": 50
                                  }
                                }
                              },
                              "refId": "A",
                              "hidden": false
                            }
                          }
                        ],
                        "transformations": [],
                        "queryOptions": {}
                      }
                    },
                    "vizConfig": {
                      "kind": "VizConfig",
                      "group": "timeseries",
                      "version": "13.0.0",
                      "spec": {
                        "options": {
                          "annotations": {
                            "clustering": -1,
