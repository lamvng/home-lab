apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ template "grafana.fullname" .Subcharts.grafana }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grafana.labels" .Subcharts.grafana | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`{{ .Values.domain }}`)
      priority: 10
      services:
        - name: {{ template "grafana.fullname" .Subcharts.grafana }}
          port: {{ .Values.grafana.service.port }}
  tls:
    secretName: {{ include "grafana.certificate" . }}
