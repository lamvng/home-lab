{{- /*
Traefik ingress for K3S
*/}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ template "firefly-iii.fullname" .Subcharts.firefly }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firefly-iii.labels" (index .Subcharts.firefly.Subcharts "firefly-iii") | nindent 4 }}
  {{- with .Values.traefikIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.domain }}`)
      priority: 10
      services:
        - name: {{ template "firefly-iii.fullname" .Subcharts.firefly }}
          port: {{ index .Subcharts.firefly.Subcharts "firefly-iii" "Values" "service" "port" }}
