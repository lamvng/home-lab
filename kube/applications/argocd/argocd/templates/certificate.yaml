apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "argocd.server.certificate" . }}
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ include "argocd.server.certificate" . }}
  isCA: false
  usages:
    - server auth
  dnsNames:
    - "argocd.homelab.me"
  issuerRef:
    name: cert-manager-certmanager
    kind: ClusterIssuer
