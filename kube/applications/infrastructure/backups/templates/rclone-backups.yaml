spec:
  suspend: true
  schedule: "0 0 31 2 *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      generateName: {{ include "backups.fullname" . }}-rclone-restore-
      labels:
        {{- include "backups.labels" . | nindent 12 }}
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 300
      template:
        spec:
          serviceAccountName: {{ include "backups.fullname" . }}
          restartPolicy: Never
          initContainers:
            - name: copy-rclone-config
              image: {{ .Values.psqlClient.image }}:{{ .Values.psqlClient.tag }}
