
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "backups.name" . }}
  labels:
    {{- include "backups.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "backups.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backups.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "backups.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backups.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "backups.name" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "backups.name" . }}
