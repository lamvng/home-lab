apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backups.fireflyConfigName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backups.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.firefly.db_config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
