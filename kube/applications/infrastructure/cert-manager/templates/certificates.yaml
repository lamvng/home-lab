apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ include "certmanager.rootCaName" . }}
  labels:
    app: {{ template "cert-manager.name" .Subcharts.certmanager }}
    app.kubernetes.io/name: {{ template "cert-manager.name" .Subcharts.certmanager }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "labels" .Subcharts.certmanager | nindent 4 }}
spec:
  selfSigned: {}

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "certmanager.rootCaName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  commonName: {{ include "certmanager.rootCaName" . }}
  secretName: {{ include "certmanager.rootCaName" . }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ include "certmanager.rootCaName" . }}
    kind: ClusterIssuer
    group: cert-manager.io

---

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ template "cert-manager.fullname" .Subcharts.certmanager }}
  labels:
    app: {{ template "cert-manager.name" .Subcharts.certmanager }}
    app.kubernetes.io/name: {{ template "cert-manager.name" .Subcharts.certmanager }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "labels" .Subcharts.certmanager | nindent 4 }}
spec:
  ca:
    secretName: {{ include "certmanager.rootCaName" . }}
