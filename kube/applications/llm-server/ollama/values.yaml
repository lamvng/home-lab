domain: ollama.homelab.me

ollama:
  replicaCount: 1
  ollama:
    gpu:
      enabled: true
      type: "amd"
      number: 1
    models:
      pull:
        # - gemma4:e4b # Need newer version of Ollama # v0.20.0
        - qwen3.5:4b
      run:
        # - gemma4:e4b # Need newer version of Ollama # v0.20.0
        - qwen3.5:4b
      clean: true

  extraEnv:
    - name: HSA_OVERRIDE_GFX_VERSION
      value: "11.0.1"
  #   - name: OLLAMA_DEBUG
  #     value: "1"

  persistentVolume:
    enabled: true
    size: 15Gi

  resources:
    requests: {}
      # memory: 4096Mi
      # cpu: 2000m
    limits: {}
      # memory: 8192Mi
      # cpu: 4000m
