apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ template "ollama.fullname" .Subcharts.ollama }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "ollama.selectorLabels" .Subcharts.ollama | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.42.0.0/16
        - ipBlock:
            cidr: 10.43.0.0/16
