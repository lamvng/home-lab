helm_version: "v3.18.4"
k9s_version: "v0.50.7"
kubectl_version: "v1.33.3"

helm_tar_url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"

k9s_deb_path: "/tmp/k9s_linux_amd64.deb"
k9s_deb_url: "https://github.com/derailed/k9s/releases/download/{{ k9s_version }}/k9s_linux_amd64.deb"

kubectl_binary_url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
kubectl_binary_tmp_path: "/tmp/kubectl"
kubectl_binary_path: "/usr/local/bin/kubectl"
kubectl_sha256_path: "/tmp/kubectl.sha256"
kubectl_sha256_url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl.sha256"
