# https://kubernetes.io/docs/tasks/tools/install-kubectl-linux/

- name: "Download kubectl binary"
  ansible.builtin.get_url:
    dest: "{{ kubectl_binary_tmp_path }}"
    mode: "0755"
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"

- name: "Download kubectl.sha256"
  ansible.builtin.get_url:
    dest: "{{ kubectl_sha256_path }}"
    mode: "0644"
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl.sha256"

- name: "Read kubectl expected sha256 checksum"
  register: "sha256_expected"
  ansible.builtin.slurp:
    src: "{{ kubectl_sha256_path }}"

- name: "Compute actual kubectl sha256 checksum"
  register: "sha256_actual"
  ansible.builtin.stat:
    checksum_algorithm: "sha256"
    path: "{{ kubectl_binary_tmp_path }}"

- name: "Fail if checksums do not match"
  when: sha256_expected.content | b64decode != sha256_actual.stat.checksum
  ansible.builtin.fail:
    msg: SHA256 mismatch. Expected {{ sha256_expected.content | b64decode }} but got {{ sha256_actual.stat.checksum }}.

- name: "Copy kubectl binary"
  become: true
  ansible.builtin.copy:
    dest: "{{ kubectl_binary_path }}"
    group: "root"
    mode: "0755"
    owner: "root"
    remote_src: true
    src: "{{ kubectl_binary_tmp_path }}"

- name: "Download and unpack kubecolor binary"
  ansible.builtin.unarchive:
    dest: "/tmp"
    remote_src: yes
    src: "https://github.com/kubecolor/kubecolor/releases/download/{{ kubecolor_version }}/kubecolor_0.5.1_linux_amd64.tar.gz"

- name: "Install kubecolor binary"
  become: true
  ansible.builtin.copy:
    src: "/tmp/kubecolor"
    dest: "/usr/local/bin/kubecolor"
    mode: "0755"
    owner: "root"
    group: "root"

- name: "Enable kubectl and kubecolor bash completion"
  ansible.builtin.blockinfile:
    append_newline: true
    block: |
      # Set kubectl and kubecolor autocompletion
      source <(kubectl completion bash)
      alias kubectl=kubecolor
      alias ktl=kubecolor
      complete -o default -F __start_kubectl ktl
    insertafter: EOF
    marker: "# {mark} ANSIBLE MANAGED BLOCK: KUBECTL"
    path: "{{ ansible_env.HOME }}/.bashrc"
    prepend_newline: true

- name: "Install kubectx"
  become: true
  ansible.builtin.apt:
    name: "kubectx"
    state: "present"
