- name: "Download k3s install script"
  ansible.builtin.get_url:
    dest: "{{ k3s_install_script_location }}"
    mode: "0755"
    url: "https://get.k3s.io"

- name: "Install k3s"
  become: true
  ansible.builtin.shell:
    cmd: "{{ k3s_install_script_location }}"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"

- name: "Populate service facts"
  ansible.builtin.service_facts:

# https://docs.k3s.io/installation/requirements?os=debian#operating-systems
- name: Add firewall rules for ufw
  become: true
  when: ansible_facts.services['ufw.service'].status == "enabled"
  block:

    - name: "Allow Kubernetes API server"
      community.general.ufw:
        rule: "allow"
        port: "6443"
        proto: "tcp"

    - name: "Allow traffic from pods"
      community.general.ufw:
        rule: "allow"
        src: "10.42.0.0/16"

    - name: "Allow traffic from services"
      community.general.ufw:
        rule: "allow"
        src: "10.43.0.0/16"

- name: "Create {{ k3s_admin_group }} group"
  become: true
  ansible.builtin.group:
    name: "{{ k3s_admin_group }}"
    state: "present"

- name: "Add {{ ansible_user_id }} user to {{ k3s_admin_group }} group"
  become: true
  ansible.builtin.user:
    append: yes
    groups: ["{{ k3s_admin_group }}"]
    name: "{{ ansible_user_id }}"

# https://docs.k3s.io/cluster-access
# The kubeconfig file is re-generated each time the k3s service start, aka. when the computer starts.
# Permission needed to be modified each time the host start.
- name: "Create a script to allow {{ k3s_admin_group }} group read k3s config"
  become: true
  ansible.builtin.template:
    dest: "{{ k3s_kubeconfig_permission_script_location }}"
    group: "{{ k3s_admin_group }}"
    mode: "0755"
    owner: "root"
    src: "{{ k3s_kubeconfig_permission_script_name }}.sh.j2"

- name: "Create systemd service to run at boot to allow {{ k3s_admin_group }} group to read k3s config"
  become: true
  ansible.builtin.template:
    dest: "{{ k3s_kubeconfig_permission_systemd_location }}"
    group: "root"
    mode: "0644"
    owner: "root"
    src: "{{ k3s_kubeconfig_permission_script_name }}.service.j2"

- name: Enable systemd service
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
    enabled: true
    name: "{{ k3s_kubeconfig_permission_script_name }}.service"
    state: "started"

- name: "Modify environment to include KUBECONFIG"
  ansible.builtin.blockinfile:
    append_newline: true
    block: |
      # Set KUBECONFIG for k3s  
      export KUBECONFIG={{ k3s_kubeconfig_location }}
    insertafter: EOF
    marker: "# {mark} ANSIBLE MANAGED BLOCK: KUBECONFIG"
    path: "{{ ansible_env.HOME }}/.bashrc"
    prepend_newline: true
