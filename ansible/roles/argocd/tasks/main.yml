- name: "Install ArgoCD via Helm for the first time"
  kubernetes.core.helm:
    chart_ref: "argo-cd"
    chart_repo_url: "https://argoproj.github.io/argo-helm"
    create_namespace: true
    release_name: "{{ argocd_name }}"
    release_namespace: "{{ argocd_name }}"
    values_files:
      - "{{ role_path }}/files/values.yaml"

- name: "Enable argocd bash completion"
  ansible.builtin.blockinfile:
    append_newline: true
    block: |
      # Set argocd autocompletion
      source <(argocd completion bash)
    insertafter: EOF
    marker: "# {mark} ANSIBLE MANAGED BLOCK: ARGOCD"
    path: "{{ ansible_env.HOME }}/.bashrc"
    prepend_newline: true

- name: "Add ArgoCD in hosts"
  become: true
  ansible.builtin.blockinfile:
    append_newline: true
    block: |
      127.0.0.1 argocd.homelab.me
    insertafter: EOF
    marker: "# {mark} ANSIBLE MANAGED BLOCK: ARGOCD"
    path: "/etc/hosts"
    prepend_newline: true

# Need to install Kubernetes library for Python to use kubernetes.core.k8s module.
# Since it is the only "manual" apply action in the playbook, let's use "kubectl apply" directly instead of messing around with PEP 668
- name: "Deploy root app"
  ansible.builtin.shell:
    cmd: "kubectl apply -n {{ argocd_name }} -f {{ role_path }}/files/root-app.yaml"

